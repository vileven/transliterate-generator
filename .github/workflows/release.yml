name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: SemVer increment to apply
        type: choice
        required: true
        default: patch
        options:
          - patch
          - minor
          - major

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build package
        run: npm run build

      - name: Configure Git user
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"

      - name: Ensure clean working directory
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "There are uncommitted changes. Committing them."
            git status --short
            git add -A
            git commit -m "chore: commit changes before npm publish"
          else
            echo "Working directory is clean."
          fi

      - name: Bump version
        run: |
          npm version "${{ inputs.release_type }}" --message "chore: release %s"

      - name: Push changes
        run: git push --follow-tags

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
